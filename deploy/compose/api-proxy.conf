# docker compose only: the web container forwards the API to the chat
# server, as the ingress does on Kubernetes, so the app and /v1 share one
# origin (the CSP allows only 'self').
location = /v1/ws {
    proxy_pass http://server:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 1h;
}

location /v1/ {
    proxy_pass http://server:8080;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Attachments and backups: up to 100 MB plus overhead, streamed.
    client_max_body_size 110m;
    proxy_request_buffering off;
}
