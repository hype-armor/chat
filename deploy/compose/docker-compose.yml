# Local development stack. Run from the repository root:
#   docker compose -f deploy/compose/docker-compose.yml up --build
# then open http://localhost:8000 on this machine. From other devices use
# HTTPS: CHAT_HOST=192.168.1.20 docker compose ... --profile https up
# and open https://192.168.1.20:8443 (browsers allow the app's encryption
# only on secure pages). First invite:
#   docker compose -f deploy/compose/docker-compose.yml exec server \
#     chat-server create-invite http://localhost:8000
# Production runs on Kubernetes (deploy/helm, docs/10-deployment-kubernetes.md).
name: chat

services:
  server:
    build:
      context: ../..
      dockerfile: deploy/docker/server.Dockerfile
    environment:
      DATABASE_URL: postgres://chat:chat@postgres:5432/chat
      CHAT_LOG_FORMAT: pretty
      # Behind the web container's /v1 proxy (rate limits by client IP).
      CHAT_TRUST_PROXY_HEADERS: "true"
      # Attachments and backups in SeaweedFS (no S3 auth in development).
      CHAT_BLOB_STORE: s3://chat-blobs
      AWS_ENDPOINT: http://seaweedfs:8333
      AWS_ALLOW_HTTP: "true"
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: dev
      AWS_SECRET_ACCESS_KEY: dev
    ports: ["8080:8080"]
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs-init:
        condition: service_completed_successfully

  web:
    build:
      context: ../..
      dockerfile: deploy/docker/web.Dockerfile
    environment:
      CSP_CONNECT_EXTRA: "ws://localhost:7880"
    ports: ["8000:8080"]
    # Forwards /v1 to the server (Kubernetes does this at the ingress).
    volumes:
      - ./api-proxy.conf:/etc/nginx/conf.d/extra/api-proxy.conf:ro
    depends_on: [server]

  # Optional HTTPS front for other devices: --profile https, CHAT_HOST set.
  https:
    image: caddy:2.10-alpine
    profiles: [https]
    environment:
      CHAT_HOST: ${CHAT_HOST:-localhost}
    ports: ["8443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data
    depends_on: [web]

  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: chat
      POSTGRES_DB: chat
    volumes: [postgres:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat"]
      interval: 2s
      retries: 30

  valkey:
    image: valkey/valkey:9.0-alpine

  # S3-compatible object storage for encrypted attachments.
  seaweedfs:
    image: chrislusf/seaweedfs:4.50
    command: server -s3 -dir=/data
    ports: ["8333:8333"]
    volumes: [seaweedfs:/data]

  # Creates the bucket once SeaweedFS is up (idempotent).
  seaweedfs-init:
    image: chrislusf/seaweedfs:4.50
    entrypoint: ["sh", "-c"]
    command:
      - until echo "s3.bucket.list" | weed shell -master=seaweedfs:9333 >/dev/null 2>&1; do sleep 1; done;
        echo "s3.bucket.create -name chat-blobs" | weed shell -master=seaweedfs:9333
    depends_on: [seaweedfs]

  # SFU for group calls; --dev uses the well-known devkey/secret pair.
  livekit:
    image: livekit/livekit-server:v1.13
    command: --dev --bind 0.0.0.0
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"

volumes:
  caddy:
  postgres:
  seaweedfs:
