# Local development stack. Run from the repository root:
#   docker compose -f deploy/compose/docker-compose.yml up --build
# then open http://localhost:8000 on this machine. From other devices use
# HTTPS: CHAT_HOST=192.168.1.20 docker compose ... --profile https up
# and open https://192.168.1.20:8443 (browsers allow the app's encryption
# only on secure pages). Add --profile echo for the echo test bot
# (message echo.00). First invite:
#   docker compose -f deploy/compose/docker-compose.yml exec server \
#     chat-server create-invite http://localhost:8000
# Production runs on Kubernetes (deploy/helm, docs/10-deployment-kubernetes.md).
name: chat

services:
  server:
    build:
      context: ../..
      dockerfile: deploy/docker/server.Dockerfile
    environment:
      DATABASE_URL: postgres://chat:chat@postgres:5432/chat
      CHAT_LOG_FORMAT: pretty
      # Behind the web container's /v1 proxy (rate limits by client IP).
      CHAT_TRUST_PROXY_HEADERS: "true"
      # Attachments and backups in SeaweedFS (no S3 auth in development).
      CHAT_BLOB_STORE: s3://chat-blobs
      AWS_ENDPOINT: http://seaweedfs:8333
      AWS_ALLOW_HTTP: "true"
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: dev
      AWS_SECRET_ACCESS_KEY: dev
      # Calls (ADR-0028/0029): the coturn service below.
      CHAT_STUN_URLS: stun:${CHAT_HOST:-localhost}:3478
      CHAT_TURN_URLS: turn:${CHAT_HOST:-localhost}:3478?transport=udp,turn:${CHAT_HOST:-localhost}:3478?transport=tcp
      CHAT_TURN_SECRET: dev-turn-secret
      # Group calls (ADR-0031): LiveKit's --dev key pair. Browsers connect to
      # CHAT_LIVEKIT_URL; with the https profile use wss://<CHAT_HOST>:8443.
      CHAT_LIVEKIT_URL: ${CHAT_LIVEKIT_URL:-ws://localhost:7880}
      CHAT_LIVEKIT_API_URL: http://livekit:7880
      CHAT_LIVEKIT_API_KEY: devkey
      CHAT_LIVEKIT_API_SECRET: secret
    ports: ["8080:8080"]
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs-init:
        condition: service_completed_successfully

  web:
    build:
      context: ../..
      dockerfile: deploy/docker/web.Dockerfile
    environment:
      CSP_CONNECT_EXTRA: ${CHAT_LIVEKIT_URL:-ws://localhost:7880}
    ports: ["8000:8080"]
    # Forwards /v1 to the server (Kubernetes does this at the ingress).
    volumes:
      - ./api-proxy.conf:/etc/nginx/conf.d/extra/api-proxy.conf:ro
    depends_on: [server]

  # Optional echo test bot (--profile echo): message `echo.00` and it sends
  # back what you send. A real client with its own keys; development only.
  echo-invite:
    build:
      context: ../..
      dockerfile: deploy/docker/server.Dockerfile
    profiles: [echo]
    # Writes a fresh invite for the bot's first sign-up (unused ones expire).
    command: ["create-invite", "--code-file", "/echo/invite"]
    environment:
      DATABASE_URL: postgres://chat:chat@postgres:5432/chat
    # Root only to write into the shared volume (development only).
    user: "0:0"
    volumes: [echo:/echo]
    depends_on:
      postgres:
        condition: service_healthy

  echo:
    build:
      context: ../..
      dockerfile: deploy/docker/echo.Dockerfile
    profiles: [echo]
    environment:
      ECHO_SERVER: http://server:8080
      ECHO_STATE_DIR: /echo/state
      ECHO_INVITE_FILE: /echo/invite
      # Call media on one published UDP port, offered at the host's address
      # (the container's own address isn't reachable from browsers).
      ECHO_CALL_IP: ${CHAT_HOST:-127.0.0.1}
      ECHO_CALL_PORT: "50100"
    ports: ["50100:50100/udp"]
    user: "0:0"
    volumes: [echo:/echo]
    restart: unless-stopped
    depends_on:
      server:
        condition: service_started
      echo-invite:
        condition: service_completed_successfully

  # Optional HTTPS front for other devices: --profile https, CHAT_HOST set.
  https:
    image: caddy:2.10-alpine
    profiles: [https]
    environment:
      CHAT_HOST: ${CHAT_HOST:-localhost}
    ports: ["8443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data
    depends_on: [web]

  # TURN relay for 1:1 calls. CHAT_HOST must be this machine's IP address
  # as other devices reach it (coturn tells them to send media there).
  # Development only: it may relay to private addresses, which production
  # (deploy/helm, turn.deniedPeerIps) forbids.
  coturn:
    image: coturn/coturn:4.7.0
    command:
      - --realm=chat.local
      - --use-auth-secret
      - --static-auth-secret=dev-turn-secret
      - --listening-port=3478
      - --min-port=49160
      - --max-port=49200
      - --external-ip=${CHAT_HOST:-127.0.0.1}
      - --no-tls
      - --no-dtls
      - --fingerprint
      - --no-cli
      - --no-multicast-peers
      - --log-file=stdout
      - --simple-log
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "49160-49200:49160-49200/udp"

  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: chat
      POSTGRES_DB: chat
    volumes: [postgres:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat"]
      interval: 2s
      retries: 30

  valkey:
    image: valkey/valkey:9.0-alpine

  # S3-compatible object storage for encrypted attachments.
  seaweedfs:
    image: chrislusf/seaweedfs:4.50
    command: server -s3 -dir=/data
    ports: ["8333:8333"]
    volumes: [seaweedfs:/data]

  # Creates the bucket once SeaweedFS is up (idempotent).
  seaweedfs-init:
    image: chrislusf/seaweedfs:4.50
    entrypoint: ["sh", "-c"]
    command:
      - |
        until buckets=$$(echo "s3.bucket.list" | weed shell -master=seaweedfs:9333 2>/dev/null); do
          sleep 1
        done
        if ! printf '%s\n' "$$buckets" | grep -q '^[[:space:]]*chat-blobs[[:space:]]'; then
          echo "s3.bucket.create -name chat-blobs" | weed shell -master=seaweedfs:9333
        fi
    depends_on: [seaweedfs]

  # SFU for group calls; --dev uses the well-known devkey/secret pair.
  livekit:
    image: livekit/livekit-server:v1.13
    # --node-ip: the address browsers send media to (CHAT_HOST for other devices).
    command: --dev --bind 0.0.0.0 --node-ip ${CHAT_HOST:-127.0.0.1}
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"

volumes:
  caddy:
  echo:
  postgres:
  seaweedfs:
