# Starting values for the LiveKit server chart
# (helm repo add livekit https://helm.livekit.io; chart livekit/livekit-server).
# Check key names against the chart version you install.
#
# WebRTC media is UDP and must reach the node directly, so LiveKit uses host
# networking; open UDP 50000-60000 and TCP 7881 on the node firewall.
replicaCount: 1
livekit:
  rtc:
    use_external_ip: true
    port_range_start: 50000
    port_range_end: 60000
    tcp_port: 7881
  # API key/secret shared with the chat server for room tokens.
  # Supply via --set or a values file kept out of git.
  keys: {}
  # TURN is coturn's job (deploy/helm, turn.*; ADR-0029): it holds UDP 3478
  # and TCP 5349 on the node. Group calls get its credentials in Phase 3
  # item 5.
  turn:
    enabled: false
loadBalancer:
  type: disable
resources:
  requests: { cpu: 500m, memory: 512Mi }
