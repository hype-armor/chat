{{- $component := dict "root" . "component" "server" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "chat.fullname" . }}-server
  labels:
    {{- include "chat.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  replicas: {{ .Values.server.replicaCount }}
  selector:
    matchLabels:
      {{- include "chat.selectorLabels" $component | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "chat.selectorLabels" $component | nindent 8 }}
      {{- if .Values.server.metrics.enabled }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.server.metrics.port | quote }}
        prometheus.io/path: /metrics
      {{- end }}
    spec:
      serviceAccountName: {{ include "chat.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      # Give open WebSockets time to drain after SIGTERM.
      terminationGracePeriodSeconds: 30
      containers:
        - name: server
          image: {{ include "chat.image" (dict "image" .Values.server.image "root" .) }}
          imagePullPolicy: {{ .Values.server.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          env:
            - name: CHAT_BIND
              value: "0.0.0.0:8080"
            - name: CHAT_LOG_FORMAT
              value: {{ .Values.server.logFormat | quote }}
            - name: RUST_LOG
              value: {{ .Values.server.logLevel | quote }}
            - name: CHAT_METRICS_BIND
              value: {{ if .Values.server.metrics.enabled }}{{ printf "0.0.0.0:%v" .Values.server.metrics.port | quote }}{{ else }}""{{ end }}
            - name: CHAT_REGISTRATION
              value: {{ .Values.server.registration | quote }}
            - name: CHAT_TRUST_PROXY_HEADERS
              value: {{ .Values.server.trustProxyHeaders | quote }}
            - name: CHAT_VAPID_SUBJECT
              value: {{ .Values.server.vapid.subject | quote }}
            {{- with .Values.server.vapid.existingSecret }}
            - name: CHAT_VAPID_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.server.vapid.secretKey }}
            {{- end }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.server.database.existingSecret }}
                  key: {{ .Values.server.database.secretKey }}
            {{- with .Values.server.blobs }}
            {{- if .bucket }}
            - name: CHAT_BLOB_STORE
              value: {{ printf "s3://%s" .bucket | quote }}
            - name: AWS_REGION
              value: {{ .region | quote }}
            {{- with .endpoint }}
            - name: AWS_ENDPOINT
              value: {{ . | quote }}
            - name: AWS_ALLOW_HTTP
              value: {{ hasPrefix "http://" . | quote }}
            {{- end }}
            {{- with .existingSecret }}
            - name: AWS_ACCESS_KEY_ID
              valueFrom: { secretKeyRef: { name: {{ . }}, key: AWS_ACCESS_KEY_ID } }
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: {{ . }}, key: AWS_SECRET_ACCESS_KEY } }
            {{- end }}
            {{- end }}
            {{- end }}
            {{- with .Values.livekit }}
            {{- if .url }}
            - name: CHAT_LIVEKIT_URL
              value: {{ .url | quote }}
            {{- with .apiUrl }}
            - name: CHAT_LIVEKIT_API_URL
              value: {{ . | quote }}
            {{- end }}
            - name: CHAT_LIVEKIT_API_KEY
              valueFrom: { secretKeyRef: { name: {{ .existingSecret }}, key: api-key } }
            - name: CHAT_LIVEKIT_API_SECRET
              valueFrom: { secretKeyRef: { name: {{ .existingSecret }}, key: api-secret } }
            {{- end }}
            {{- end }}
            {{- if .Values.turn.enabled }}
            {{- $h := .Values.turn.host }}
            - name: CHAT_STUN_URLS
              value: {{ printf "stun:%s:%v" $h .Values.turn.port | quote }}
            - name: CHAT_TURN_URLS
              value: {{ printf "turn:%s:%v?transport=udp,turn:%s:%v?transport=tcp%s" $h .Values.turn.port $h .Values.turn.port (ternary (printf ",turns:%s:%v?transport=tcp" $h .Values.turn.tls.port) "" (ne .Values.turn.tls.secretName "")) | quote }}
            - name: CHAT_TURN_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.turn.existingSecret }}
                  key: {{ .Values.turn.secretKey }}
            {{- end }}
            {{- with .Values.server.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
            {{- if .Values.server.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.server.metrics.port }}
            {{- end }}
          livenessProbe:
            httpGet: { path: /healthz, port: http }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
          resources:
            {{- toYaml .Values.server.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "chat.fullname" . }}-server
  labels:
    {{- include "chat.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  selector:
    {{- include "chat.selectorLabels" $component | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
    {{- if .Values.server.metrics.enabled }}
    - name: metrics
      port: {{ .Values.server.metrics.port }}
      targetPort: metrics
    {{- end }}
