{{- $component := dict "root" . "component" "server" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "chat.fullname" . }}-server
  labels:
    {{- include "chat.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  replicas: {{ .Values.server.replicaCount }}
  selector:
    matchLabels:
      {{- include "chat.selectorLabels" $component | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "chat.selectorLabels" $component | nindent 8 }}
    spec:
      serviceAccountName: {{ include "chat.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      # Give open WebSockets time to drain after SIGTERM.
      terminationGracePeriodSeconds: 30
      containers:
        - name: server
          image: {{ include "chat.image" (dict "image" .Values.server.image "root" .) }}
          imagePullPolicy: {{ .Values.server.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          env:
            - name: CHAT_BIND
              value: "0.0.0.0:8080"
            - name: CHAT_LOG_FORMAT
              value: {{ .Values.server.logFormat | quote }}
            - name: RUST_LOG
              value: {{ .Values.server.logLevel | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.server.database.existingSecret }}
                  key: {{ .Values.server.database.secretKey }}
            {{- with .Values.server.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet: { path: /healthz, port: http }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
          resources:
            {{- toYaml .Values.server.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "chat.fullname" . }}-server
  labels:
    {{- include "chat.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  selector:
    {{- include "chat.selectorLabels" $component | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
