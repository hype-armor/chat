{{- if .Values.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "chat.fullname" . }}
  labels:
    {{- include "chat.labels" . | nindent 4 }}
spec:
  parentRefs:
    {{- toYaml .Values.gateway.parentRefs | nindent 4 }}
  hostnames: [{{ .Values.host | quote }}]
  rules:
    - matches:
        - path: { type: PathPrefix, value: /v1 }
      backendRefs:
        - name: {{ include "chat.fullname" . }}-server
          port: 80
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - name: {{ include "chat.fullname" . }}-web
          port: 80
{{- end }}
