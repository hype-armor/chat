{{- if and .Values.ingress.enabled .Values.ingress.hsts }}
# Traefik adds Strict-Transport-Security to responses of the ingress router
# (see the router.middlewares annotation in ingress.yaml). Requires Traefik CRDs.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "chat.fullname" . }}-hsts
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "chat.labels" . | nindent 4 }}
spec:
  headers:
    stsSeconds: 31536000
{{- end }}
