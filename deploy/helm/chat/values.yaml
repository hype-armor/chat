# Default values for the chat chart. See docs/10-deployment-kubernetes.md.
# Datastores (PostgreSQL, object storage) and LiveKit are installed
# separately; this chart deploys our own components only.

nameOverride: ""
fullnameOverride: ""

# Public hostname serving both the web app (/) and the API (/v1, /healthz).
host: chat.example.com

server:
  image:
    repository: ghcr.io/hype-armor/chat-server
    tag: ""            # defaults to .Chart.AppVersion
    pullPolicy: IfNotPresent
  replicaCount: 1
  # Secret holding DATABASE_URL (e.g. the CloudNativePG app secret's `uri`).
  database:
    existingSecret: chat-db-app
    secretKey: uri
  logFormat: json
  logLevel: info
  # Take the client IP (for per-IP limits) from the last X-Forwarded-For
  # entry. True when the server is only reachable through the ingress.
  trustProxyHeaders: true
  # Sign-up: "invite" (an invite link is needed; ADR-0021) or "open"
  # (development only). Create the first invite with:
  #   kubectl -n chat exec deploy/chat-server -- chat-server create-invite https://<host>
  registration: invite
  # Prometheus metrics on their own port (not routed by the ingress):
  # aggregate latency histograms and counters, no per-user labels.
  metrics:
    enabled: true
    port: 9090
  # Web Push (VAPID) key. Create one with `chat-server generate-vapid-key`
  # and store it in a Secret; without it a random key is used and push
  # subscriptions break whenever the pod restarts.
  vapid:
    existingSecret: ""
    secretKey: private-key
    subject: "mailto:ops@example.com"
  # Encrypted attachments and backups (ADR-0023): an S3-compatible bucket,
  # e.g. SeaweedFS on k3s (deploy/k8s/seaweedfs.yaml) or Linode Object Storage. Credentials come from a Secret with
  # AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY. Without a bucket, the
  # server keeps attachments in memory (lost on restart).
  blobs:
    bucket: ""
    endpoint: ""          # e.g. http://seaweedfs.chat.svc:8333 for in-cluster SeaweedFS
    region: us-east-1
    existingSecret: ""
  extraEnv: []
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { memory: 512Mi }

web:
  image:
    repository: ghcr.io/hype-armor/chat-web
    tag: ""
    pullPolicy: IfNotPresent
  replicaCount: 1
  # Extra CSP connect-src origins, e.g. the LiveKit signalling URL.
  cspConnectExtra: "wss://rtc.chat.example.com"
  # Map tiles (ADR-0026): a directory holding basemap.pmtiles, from a PVC
  # or (single-node k3s) a host directory. Unset: no map, coordinates only.
  tiles:
    existingClaim: ""
    hostPath: ""
  resources:
    requests: { cpu: 20m, memory: 32Mi }
    limits: { memory: 128Mi }

# Group calls (ADR-0031) through LiveKit, installed separately
# (deploy/k8s/livekit-values.yaml). `url` is what browsers connect to (also
# add it to web.cspConnectExtra); the Secret holds `api-key` and
# `api-secret`, the same pair LiveKit is configured with. Unset url: off.
livekit:
  url: ""                 # e.g. wss://rtc.chat.example.com
  apiUrl: ""              # default: url with http(s); e.g. http://livekit-server.chat.svc:7880
  existingSecret: chat-livekit

# TURN relay for 1:1 calls (coturn, ADR-0029). Needs the node's UDP and
# TCP `port`, TCP `tls.port` and UDP `relayPorts` open to the internet, and
# DNS for `host` pointing at the node. The secret is shared with the server,
# which hands out short-lived credentials (GET /v1/turn):
#   kubectl -n chat create secret generic chat-turn \
#     --from-literal=static-auth-secret="$(openssl rand -hex 32)"
turn:
  enabled: false
  host: turn.chat.example.com
  image:
    repository: coturn/coturn
    tag: "4.7.0"
    pullPolicy: IfNotPresent
  existingSecret: chat-turn
  secretKey: static-auth-secret
  port: 3478
  # Below LiveKit's 50000-60000 so both fit on one node.
  relayPorts: { min: 49152, max: 49999 }
  # The node's public IP when it sits behind NAT (cloud VMs with a
  # floating IP); empty when the public address is on the interface.
  externalIp: ""
  tls:
    port: 5349
    # Secret with tls.crt/tls.key; with `issuer`, cert-manager creates it.
    secretName: chat-turn-tls
    issuer: letsencrypt
  # Concurrent relay allocations per credential and in total.
  userQuota: 12
  totalQuota: 1200
  # Peers the relay must never reach (private, loopback, link-local,
  # carrier-grade NAT and cluster ranges).
  deniedPeerIps:
    - 0.0.0.0-0.255.255.255
    - 10.0.0.0-10.255.255.255
    - 100.64.0.0-100.127.255.255
    - 127.0.0.0-127.255.255.255
    - 169.254.0.0-169.254.255.255
    - 172.16.0.0-172.31.255.255
    - 192.0.0.0-192.0.0.255
    - 192.168.0.0-192.168.255.255
    - 198.18.0.0-198.19.255.255
    - "::1"
    - fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
    - fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
  # Session logs name both sides' IP addresses; keep off except to debug.
  logs: false
  nodeSelector: {}
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 256Mi }

# Classic Ingress. Long timeouts keep client WebSockets open.
ingress:
  enabled: true
  className: ""
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
  tls:
    enabled: true
    secretName: chat-tls

# Gateway API alternative to Ingress (enable one or the other).
gateway:
  enabled: false
  parentRefs: []
  #  - name: public
  #    namespace: gateway-system

networkPolicy:
  enabled: true
  # Namespace label selecting the ingress/gateway controller pods' namespace.
  ingressNamespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: ingress
  # Namespace allowed to scrape the server's metrics port.
  metricsNamespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: monitoring

serviceAccount:
  create: true
  name: ""

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
