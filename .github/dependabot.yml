# Dependency updates: Rust crates from Cargo.lock and npm packages from the
# pnpm workspace, checked weekly. Security advisories are handled by
# .github/workflows/security.yml and by GitHub's own Dependabot alerts.
version: 2

updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: UTC
    open-pull-requests-limit: 5
    # Routine updates arrive as one pull request; major updates stay separate
    # because they need a human to read the changelog.
    groups:
      cargo-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: UTC
    open-pull-requests-limit: 5
    versioning-strategy: increase
    groups:
      npm-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
