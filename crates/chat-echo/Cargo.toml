[package]
name = "chat-echo"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Echo test bot: a real end-to-end encrypted client that sends back what it receives"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
chat-core = { version = "0.1.0", path = "../chat-core" }
chat-proto = { version = "0.1.0", path = "../chat-proto" }
futures-util = "0.3.34"
prost = "0.14.4"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
str0m = { version = "0.24.1", default-features = false, features = ["rust-crypto"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal", "time", "fs", "net", "io-util"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.26.1", features = ["serde"] }
