[package]
name = "chat-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.23.1"
chat-proto = { version = "0.1.0", path = "../chat-proto" }
p256 = { version = "0.14.0", features = ["ecdsa"] }
prometheus-client = "0.25.1"
prost = "0.14.4"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.8.6", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "migrate", "macros", "uuid"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal", "net"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = { version = "1.26.1", features = ["v4", "serde"] }

[dev-dependencies]
chat-core = { path = "../chat-core" }
futures-util = "0.3.34"
http-body-util = "0.1.5"
serde_json = "1.0.154"
tokio-tungstenite = "0.30.0"
tower = "0.5.3"
