[package]
name = "chat-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
chat-proto = { version = "0.1.0", path = "../chat-proto" }
prost = "0.14.4"
sqlx = { version = "0.8.6", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "migrate", "macros"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal", "net"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

[dev-dependencies]
futures-util = "0.3.34"
http-body-util = "0.1.5"
tokio-tungstenite = "0.30.0"
tower = "0.5.3"
