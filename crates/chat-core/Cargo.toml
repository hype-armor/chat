[package]
name = "chat-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Browser build: wasm-bindgen exports plus browser randomness sources.
wasm = ["dep:wasm-bindgen", "dep:js-sys", "dep:getrandom", "openmls/js"]
js-sys = ["dep:js-sys"]

[dependencies]
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc", "stream"] }
chat-proto = { version = "0.1.0", path = "../chat-proto" }
getrandom = { version = "0.2", features = ["js"], optional = true }
js-sys = { version = "0.3.106", optional = true }
openmls = "0.8.3"
openmls_basic_credential = "0.5.0"
openmls_memory_storage = "0.5"
openmls_rust_crypto = "0.5.1"
openmls_traits = "0.5"
postcard = { version = "1.1.3", features = ["alloc"] }
prost = "0.14.4"
qrcode = { version = "0.14.1", default-features = false }
rqrr = { version = "0.11.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.1"
thiserror = "2.0.21"
wasm-bindgen = { version = "0.2.129", optional = true }

