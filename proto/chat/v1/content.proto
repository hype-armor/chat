// Plaintext carried inside MLS application messages. Only group members
// ever see these fields; the server sees only the encrypted Envelope.
syntax = "proto3";

package chat.v1;

message Content {
  // Sender's clock, milliseconds since the Unix epoch.
  uint64 sent_at_ms = 1;
  oneof body {
    Text text = 2;
    Profile profile = 3;
    GroupInfo group_info = 4;
    DeviceSync device_sync = 5;
    Receipt receipt = 6;
    Attachment attachment = 7;
    Location location = 8;
    LiveLocation live_location = 9;
    Call call = 10;
  }
}

message Text {
  string body = 1;
}

// Sent when a conversation starts so members can label each other.
message Profile {
  string display_name = 1;
}

// Group metadata, sent by the member who created or renamed the group.
message GroupInfo {
  string name = 1;
  // Admin account ids (16 bytes each), in priority order (ADR-0016).
  repeated bytes admins = 2;
}

// State shared between one account's own devices, sent only in their
// private self conversation (ADR-0019). `state` is a JSON document owned by
// the client (display name, contact names, conversation metadata).
message DeviceSync {
  bytes state = 1;
}

// Delivery and read receipts (FR-MSG-5) for messages in the same
// conversation, by their envelope message ids.
message Receipt {
  enum Kind {
    DELIVERED = 0;
    READ = 1;
  }
  Kind kind = 1;
  repeated bytes message_ids = 2;
}

// An image or file in blob storage (ADR-0023, ADR-0024). The blob holds the
// file encrypted under `key`; only members can fetch and open it.
message Attachment {
  // 16-byte blob id from `PUT /v1/blobs`.
  bytes blob_id = 1;
  // 32-byte AES-256 key, used for this file only.
  bytes key = 2;
  // SHA-256 of the ciphertext.
  bytes digest = 3;
  // Plaintext size in bytes, without padding.
  uint64 size = 4;
  string mime = 5;
  string name = 6;
  // Images: pixel size, and a small JPEG preview (sent inline, encrypted
  // by MLS with the rest of this message).
  uint32 width = 7;
  uint32 height = 8;
  bytes thumbnail = 9;
  string caption = 10;
  // Audio and video: length in milliseconds.
  uint32 duration_ms = 11;
  // Recorded in the app as a voice note (shown as one, not as a file).
  bool voice_note = 12;
}

// A location shared once (FR-LOC-1, doc 06). Coordinates travel only
// inside MLS; the server never sees them (FR-LOC-4).
message Location {
  double latitude = 1;
  double longitude = 2;
  // Radius in metres the position is accurate to.
  float accuracy_m = 3;
  // Optional place name, chosen by the sender.
  string label = 4;
}

// Live location (FR-LOC-2/3, doc 06 §2). The first message of a session
// starts it; later ones move the point; `stopped` ends it early. Receivers
// keep only the latest point and discard it when the session ends.
message LiveLocation {
  // 16 random bytes naming the session.
  bytes session_id = 1;
  // When sharing ends on its own (sender's clock).
  uint64 expires_at_ms = 2;
  // Absent in a stop message.
  Location location = 3;
  bool stopped = 4;
}

// Call signalling (FR-CALL-1, ADR-0028), end-to-end encrypted like any
// message so the server can't read or alter SDP and DTLS fingerprints.
message Call {
  enum Kind {
    OFFER = 0;
    ANSWER = 1;
    CANDIDATE = 2;
    HANGUP = 3;
    DECLINE = 4;
    BUSY = 5;
  }
  // 16 random bytes naming the call.
  bytes call_id = 1;
  Kind kind = 2;
  // Offer and answer.
  string sdp = 3;
  // An ICE candidate as JSON (RTCIceCandidateInit).
  string candidate = 4;
  // Offer: a video call.
  bool video = 5;
  // Answer and candidates: the device (16 bytes) they are meant for.
  bytes to_device = 6;
}
