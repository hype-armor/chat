// Plaintext carried inside MLS application messages. Only group members
// ever see these fields; the server sees only the encrypted Envelope.
syntax = "proto3";

package chat.v1;

message Content {
  // Sender's clock, milliseconds since the Unix epoch.
  uint64 sent_at_ms = 1;
  oneof body {
    Text text = 2;
    Profile profile = 3;
    GroupInfo group_info = 4;
    DeviceSync device_sync = 5;
    Receipt receipt = 6;
    Attachment attachment = 7;
    Location location = 8;
    LiveLocation live_location = 9;
    Call call = 10;
    Typing typing = 12;
    Locality locality = 14;
    Reaction reaction = 16;
    Deletion deletion = 17;
    GroupTopic group_topic = 18;
    PresenceEvent presence = 19;
    RestrictedChannelInfo restricted_channel_info = 20;
  }
  // Original envelope message id in this conversation, exactly 16 bytes.
  // Absent for an ordinary message. Only used on user-visible messages.
  optional bytes reply_to = 11;
  // SHA-256 of the original authenticated sender and encoded Content.
  // Exactly 32 bytes. Receivers must verify this before showing a quote.
  optional bytes reply_to_hash = 13;
}

// Encrypted inside the restricted channel MLS conversation only, never the
// parent group. The authenticated MLS context supplies the channel ID and sender.
// Receivers must independently authorize the sender and parent/channel membership.
// This body makes no roster or authorization claims. Names are at most 512 UTF-8
// bytes. Parent and channel IDs must be distinct and exactly 16 bytes.
message RestrictedChannelInfo {
  bytes parent_conversation_id = 1;
  string name = 2;
  // Zero or missing is the original binding, not an update to an established
  // channel. Carry the current revision when binding a newly invited device.
  uint32 name_revision = 3;
}

// Experimental wire format only. This is deliberately not a Content body: no
// existing send or receive path may publish or accept it. A future dedicated
// transport must encrypt it to each authorized recipient device, authenticate
// the MLS sender, and independently validate all fields before acceptance.
// Never send it to the parent group. The server must not see the plaintext.
// Replay fences and MLS state must be committed atomically with acceptance;
// restoring an older fence is unsafe. No authorization is defined here.
message RestrictedChannelBinding {
  bytes parent_conversation_id = 1; // 16 bytes
  bytes channel_conversation_id = 2; // 16 bytes, distinct from parent
  bytes recipient_device = 3; // 32-byte account/device MLS identity
  uint64 parent_epoch = 4;
  uint64 channel_epoch = 5;
  // Complete canonical MLS device identities for the stated epochs. These
  // claims are not evidence: compare them with independently authenticated
  // parent and channel MLS state under the mutation lock.
  repeated bytes parent_members = 6;
  repeated bytes channel_members = 7;
  // Positive monotonic generation scoped to sender device, recipient device,
  // parent and channel. Durable rollback-safe fencing remains unresolved.
  uint64 generation = 8;
  // Encrypted channel display name, if any. This is not parent-group metadata.
  string name = 9;
}

// Encrypted group topic update. Empty text clears the topic. Receivers must
// enforce a 512-byte UTF-8 limit and a clock in 1..=9007199254740991,
// authenticate the MLS sender, and verify group membership at the message epoch.
message GroupTopic {
  string text = 1;
  uint64 clock = 2;
}

// Experimental ephemeral Content body for a separate transport. It must not
// be sent through the durable envelope queue.
// The MLS authenticated credential supplies the sender account and device.
// The conversation and recipient are checked against the selected direct chat.
message PresenceEvent {
  bytes conversation_id = 1; // 16 bytes
  bytes recipient_account = 2; // 16 bytes
  uint64 consent_generation = 3;
  enum State {
    STATE_UNSPECIFIED = 0;
    ONLINE = 1;
    AWAY = 2;
  }
  State state = 4;
  uint64 sent_at_ms = 5;
  uint64 expires_at_ms = 6;
}

// Ephemeral state, not history. Identity comes from the authenticated MLS
// sender. Content.sent_at_ms orders updates per sender device. Both start
// and stop events expire: 0 < expires_at_ms - sent_at_ms <= 10 seconds.
message Typing {
  bool active = 1;
  uint64 expires_at_ms = 2;
  // Optional coarse activity. Unknown or semantically invalid decoded details
  // fall back to generic typing. Malformed protobuf is rejected during decode.
  optional string activity = 3;
  optional string tool = 4;
}

// Encrypted durable update. Empty emoji removes the account reaction.
message Reaction {
  bytes target = 1;
  bytes target_hash = 2;
  bytes target_author = 3;
  string emoji = 4;
}

// Encrypted deletion request. The authenticated sender account must equal
// target_author. The worker verifies the original hash and the 1-hour window.
message Deletion {
  bytes target = 1;
  bytes target_hash = 2;
  bytes target_author = 3;
}

// Coarse foreground locality, shared only after explicit opt-in (ADR-0041).
// Exact coordinates never enter this body. An empty city revokes the locality.
// Both updates and revocations expire within 1 hour of Content.sent_at_ms.
message Locality {
  string city = 1;
  string region = 2;
  string country = 3;
  uint64 expires_at_ms = 4;
}

message Text {
  string body = 1;
}

// Sent when a conversation starts so members can label each other, and
// again when the sender changes their name or photo. `refresh` asks an
// existing direct-contact peer to return its current encrypted profile. It
// lets a returning device recover a profile update it missed without server
// metadata.
message Profile {
  string display_name = 1;
  // A square JPEG of the sender's photo, at most 32 KiB. Empty: no photo.
  bytes avatar = 2;
  bool refresh = 3;
}

// Group metadata, sent by the member who created or renamed the group.
message GroupInfo {
  string name = 1;
  // Admin account ids (16 bytes each), in priority order (ADR-0016).
  repeated bytes admins = 2;
}

// State shared between one account's own devices, sent only in their
// private self conversation (ADR-0019). `state` is a JSON document owned by
// the client (display name, contact names, conversation metadata).
message DeviceSync {
  bytes state = 1;
}

// Delivery and read receipts (FR-MSG-5) for messages in the same
// conversation, by their envelope message ids.
message Receipt {
  enum Kind {
    DELIVERED = 0;
    READ = 1;
  }
  Kind kind = 1;
  repeated bytes message_ids = 2;
}

// An image or file in blob storage (ADR-0023, ADR-0024). The blob holds the
// file encrypted under `key`; only members can fetch and open it.
message Attachment {
  // 16-byte blob id from `PUT /v1/blobs`.
  bytes blob_id = 1;
  // 32-byte AES-256 key, used for this file only.
  bytes key = 2;
  // SHA-256 of the ciphertext.
  bytes digest = 3;
  // Plaintext size in bytes, without padding.
  uint64 size = 4;
  string mime = 5;
  string name = 6;
  // Images: pixel size, and a small JPEG preview (sent inline, encrypted
  // by MLS with the rest of this message).
  uint32 width = 7;
  uint32 height = 8;
  bytes thumbnail = 9;
  string caption = 10;
  // Audio and video: length in milliseconds.
  uint32 duration_ms = 11;
  // Recorded in the app as a voice note (shown as one, not as a file).
  bool voice_note = 12;
}

// A location shared once (FR-LOC-1, doc 06). Coordinates travel only
// inside MLS; the server never sees them (FR-LOC-4).
message Location {
  double latitude = 1;
  double longitude = 2;
  // Radius in metres the position is accurate to.
  float accuracy_m = 3;
  // Optional place name, chosen by the sender.
  string label = 4;
}

// Live location (FR-LOC-2/3, doc 06 §2). The first message of a session
// starts it; later ones move the point; `stopped` ends it early. Receivers
// keep only the latest point and discard it when the session ends.
message LiveLocation {
  // 16 random bytes naming the session.
  bytes session_id = 1;
  // When sharing ends on its own, or its renewable lease ends, on sender's clock.
  uint64 expires_at_ms = 2;
  // Absent in a stop message.
  Location location = 3;
  bool stopped = 4;
  // Until-stopped shares renew this lease on each update. A quiet session
  // expires after 8 hours.
  bool until_stopped = 5;
}

// Call signalling (FR-CALL-1, ADR-0028), end-to-end encrypted like any
// message so the server can't read or alter SDP and DTLS fingerprints.
message Call {
  enum Kind {
    OFFER = 0;
    ANSWER = 1;
    CANDIDATE = 2;
    HANGUP = 3;
    DECLINE = 4;
    BUSY = 5;
  }
  // 16 random bytes naming the call.
  bytes call_id = 1;
  Kind kind = 2;
  // Offer and answer.
  string sdp = 3;
  // An ICE candidate as JSON (RTCIceCandidateInit).
  string candidate = 4;
  // Offer: a video call.
  bool video = 5;
  // Answer and candidates: the device (16 bytes) they are meant for.
  bytes to_device = 6;
  // Offer: a group call through the SFU (ADR-0031); no SDP, members join
  // the call's LiveKit room instead.
  bool group = 7;
}
