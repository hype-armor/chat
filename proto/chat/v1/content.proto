// Plaintext carried inside MLS application messages. Only group members
// ever see these fields; the server sees only the encrypted Envelope.
syntax = "proto3";

package chat.v1;

message Content {
  // Sender's clock, milliseconds since the Unix epoch.
  uint64 sent_at_ms = 1;
  oneof body {
    Text text = 2;
    Profile profile = 3;
    GroupInfo group_info = 4;
    DeviceSync device_sync = 5;
  }
}

message Text {
  string body = 1;
}

// Sent when a conversation starts so members can label each other.
message Profile {
  string display_name = 1;
}

// Group metadata, sent by the member who created or renamed the group.
message GroupInfo {
  string name = 1;
  // Admin account ids (16 bytes each), in priority order (ADR-0016).
  repeated bytes admins = 2;
}

// State shared between one account's own devices, sent only in their
// private self conversation (ADR-0019). `state` is a JSON document owned by
// the client (display name, contact names, conversation metadata).
message DeviceSync {
  bytes state = 1;
}
