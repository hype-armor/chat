// Wire format shared by the server transport, local-network mode and the
// radio mesh. Everything inside `ciphertext` is end-to-end encrypted; the
// fields outside it are the only things a server or relay can see.
syntax = "proto3";

package chat.v1;

// An end-to-end encrypted unit of delivery (doc 03 §5.1).
message Envelope {
  uint32 version = 1;
  // Opaque conversation identifier (MLS group id). Not linked to members.
  bytes conversation_id = 2;
  // MLS epoch the ciphertext belongs to.
  uint64 epoch = 3;
  ContentType content_type = 4;
  // MLS-encrypted payload, padded to a size bucket by the sender.
  bytes ciphertext = 5;
  // Random id used for de-duplication and acknowledgement.
  bytes message_id = 6;
}

enum ContentType {
  CONTENT_TYPE_UNSPECIFIED = 0;
  // MLS application message (text, media pointer, location, call signal).
  CONTENT_TYPE_APPLICATION = 1;
  // MLS commit or proposal; the delivery service orders these per group.
  CONTENT_TYPE_HANDSHAKE = 2;
  // MLS welcome for a newly added member.
  CONTENT_TYPE_WELCOME = 3;
  // MLS proposal (e.g. a member leaving); delivered without epoch ordering
  // and committed later by another member (ADR-0016).
  CONTENT_TYPE_PROPOSAL = 4;
}

// Frames exchanged over the client <-> server WebSocket. The first client
// frame must be `authenticate`: browsers can't set headers on WebSocket
// requests, and tokens in URLs end up in logs.
message ClientFrame {
  uint64 request_id = 1;
  oneof body {
    SendEnvelope send = 2;
    Ack ack = 3;
    Ping ping = 4;
    Authenticate authenticate = 5;
  }
}

message ServerFrame {
  // Echoes ClientFrame.request_id when the frame is a response.
  uint64 request_id = 1;
  oneof body {
    SendResult send_result = 2;
    Envelope deliver = 3;
    Pong pong = 4;
    Error error = 5;
    AuthResult auth_result = 6;
  }
}

message Authenticate {
  // Device token from POST /v1/auth/verify.
  string token = 1;
}

message AuthResult {
  // 16-byte device UUID.
  bytes device_id = 1;
}

message SendEnvelope {
  Envelope envelope = 1;
  // Recipient device ids (16-byte UUIDs), resolved by the sender from group
  // state. For handshake messages, `envelope.epoch` is the epoch the commit
  // was created in (before it is applied).
  repeated bytes recipient_devices = 2;
  // A commit that adds members carries their welcome: the server accepts
  // both in one transaction, so new members are reachable before anyone
  // sees the commit (ADR-0017).
  Envelope welcome = 3;
  repeated bytes welcome_recipients = 4;
  // No Web Push for offline recipients (e.g. receipts): nothing a person
  // needs to be told about.
  bool silent = 5;
}

message SendResult {
  bool accepted = 1;
  // Set when a handshake message lost the race for its epoch (doc 03 §5.3).
  bool epoch_conflict = 2;
}

message Ack {
  bytes message_id = 1;
}

message Ping {}
message Pong {}

message Error {
  uint32 code = 1;
  string message = 2;
}
