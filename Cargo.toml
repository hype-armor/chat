[workspace]
resolver = "3"
members = ["crates/chat-proto", "crates/chat-core", "crates/chat-server"]

[workspace.package]
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/hype-armor/chat"
rust-version = "1.88"

[profile.release]
lto = true
codegen-units = 1
strip = true

[profile.release.package.chat-core]
opt-level = "s"
